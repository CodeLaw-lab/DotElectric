name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    # ⚠️ WARNING: WPF (net10.0-windows) requires Windows runner. Do NOT change to ubuntu-latest!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/DotElectric.TemplateEditor.slnx

      - name: Build
        run: dotnet build src/DotElectric.TemplateEditor.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test src/DotElectric.TemplateEditor.slnx --no-restore --configuration Release --collect:"XPlat Code Coverage" --results-directory TestResults/

      - name: Install ReportGenerator
        run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path .reporttools --version 5.5.11

      - name: Check coverage gate (≥80%, merged across test projects)
        shell: pwsh
        run: |
          & "$PWD/.reporttools/reportgenerator.exe" "-reports:TestResults/*/coverage.cobertura.xml" "-targetdir:TestResults/merged" "-reporttypes:Cobertura"
          $merged = Join-Path TestResults 'merged' 'Cobertura.xml'
          if (-not (Test-Path $merged)) {
            Write-Host "❌ Merged coverage file not found"
            exit 1
          }
          [xml]$xml = Get-Content $merged
          $lineRate = [double]$xml.coverage.'line-rate'
          $pct = [math]::Round($lineRate * 100, 2)
          Write-Host "📊 Merged line coverage: $pct%"
          if ($pct -lt 80) {
            Write-Host "❌ Coverage $pct% is below gate 80%"
            exit 1
          }
          Write-Host "✅ Coverage gate passed ($pct% ≥ 80%)"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/
